name: Finalize archival release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish v1.0.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          First formal public archival version of the MATLAB implementation associated with:

          **Iqbal, H., Zheng, J., Chai, R., & Chandrasekaran, S. (2024). “Electric powered wheelchair control using user-independent classification methods based on surface electromyography signals.” Medical & Biological Engineering & Computing, 62(1), 167–182. https://doi.org/10.1007/s11517-023-02921-z**

          ### Repository preparation

          - Added a publication-focused README with research context, algorithm comparison, repository structure, requirements, safety scope, reproducibility limitations, and citation guidance.
          - Added `CITATION.cff` with DOI-backed preferred citation metadata.
          - Added `REPRODUCIBILITY.md` documenting archived artifacts and historical configuration/file-name differences.
          - Added contribution guidance and MATLAB-specific ignore rules.
          - Added explicit repository version metadata and changelog.

          ### Research code

          - No MATLAB `.m` research implementation was modified as part of the public-archive preparation.
          - Existing model/evaluation `.mat` artifacts were retained unchanged for provenance.
          - Participant-level raw sEMG recordings are not distributed in the repository.

          ### Scope

          Version 1.0.0 denotes the archived public research-code state. It does not imply clinical, regulatory, medical-device, or production readiness.
          EOF

          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "Release v1.0.0 already exists."
          else
            gh release create v1.0.0 \
              --target main \
              --title "v1.0.0 — Archival Research Release" \
              --notes-file release-notes.md \
              --latest
          fi

      - name: Attempt to set repository topics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e
          response=$(curl -sS -o /tmp/topics-response.txt -w "%{http_code}" \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/topics \
            -d '{"names":["semg","hand-gesture-recognition","multi-class-svm","powered-wheelchair","assistive-technology","machine-learning","human-machine-interface","matlab"]}')
          cat /tmp/topics-response.txt
          echo "HTTP status: ${response}"
          exit 0
